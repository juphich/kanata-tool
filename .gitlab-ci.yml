stages:
  - verify
  - package
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

default:
  interruptible: true

variables:
  PACKAGE_NAME: "kanata-tool"
  PACKAGE_VERSION: "${CI_COMMIT_TAG}"
  PACKAGE_BASE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}"
  RELEASE_TARBALL: "${PACKAGE_NAME}-${CI_COMMIT_TAG}.tar.gz"
  RELEASE_ZIP: "${PACKAGE_NAME}-${CI_COMMIT_TAG}.zip"

verify:
  stage: verify
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - shellcheck src/install.sh src/scripts/package.sh src/scripts/fetch-kanata-binaries.sh src/commands/linux/*.sh src/commands/macos/*.sh src/bin/kanata-tool src/lib/paths.sh
    - bash -n src/install.sh
    - bash -n src/scripts/package.sh
    - bash -n src/scripts/fetch-kanata-binaries.sh
    - bash -n src/commands/linux/setup.sh
    - bash -n src/commands/linux/uninstall.sh
    - bash -n src/commands/linux/device.sh
    - bash -n src/commands/linux/start.sh
    - bash -n src/commands/linux/stop.sh
    - bash -n src/commands/macos/setup.sh
    - bash -n src/commands/macos/uninstall.sh
    - bash -n src/commands/macos/device.sh
    - bash -n src/commands/macos/start.sh
    - bash -n src/commands/macos/stop.sh
    - bash -n src/bin/kanata-tool
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify_windows:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/install.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/bin/kanata-tool.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/lib/paths.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/commands/windows/setup.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/commands/windows/uninstall.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/commands/windows/device.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/commands/windows/start.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("src/commands/windows/stop.ps1",[ref]$null,[ref]$null) | Out-Null'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

package:
  stage: package
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash zip tar coreutils curl
  script:
    - test -n "${CI_COMMIT_TAG}"
    - bash src/scripts/package.sh "${CI_COMMIT_TAG}"
    - test -f "dist/${RELEASE_TARBALL}"
    - test -f "dist/${RELEASE_ZIP}"
    - test -f "dist/SHA256SUMS"
    - |
      curl --retry 3 --retry-all-errors --fail --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${RELEASE_TARBALL}" \
        "${PACKAGE_BASE_URL}/${RELEASE_TARBALL}"
    - |
      curl --retry 3 --retry-all-errors --fail --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${RELEASE_ZIP}" \
        "${PACKAGE_BASE_URL}/${RELEASE_ZIP}"
    - |
      curl --retry 3 --retry-all-errors --fail --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/SHA256SUMS" \
        "${PACKAGE_BASE_URL}/SHA256SUMS"

  artifacts:
    name: "kanata-tool-${CI_COMMIT_TAG}"
    paths:
      - dist/
    expire_in: 1 year
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package
      artifacts: false
  script:
    - echo "Create GitLab Release"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "kanata-tool $CI_COMMIT_TAG"
    description: "kanata-tool release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "${RELEASE_TARBALL}"
          url: "${PACKAGE_BASE_URL}/${RELEASE_TARBALL}"
          link_type: package
        - name: "${RELEASE_ZIP}"
          url: "${PACKAGE_BASE_URL}/${RELEASE_ZIP}"
          link_type: package
        - name: "SHA256SUMS"
          url: "${PACKAGE_BASE_URL}/SHA256SUMS"
          link_type: other
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
