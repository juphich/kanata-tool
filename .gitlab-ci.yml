stages:
  - verify
  - package
  - release

default:
  interruptible: true

verify:
  stage: verify
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - shellcheck install.sh fetch-kanata-binaries.sh commands/linux/*.sh commands/macos/*.sh tool/kanata-tool
    - sh -n install.sh
    - bash -n commands/linux/setup.sh
    - bash -n commands/linux/uninstall.sh
    - bash -n commands/linux/device.sh
    - bash -n commands/linux/start.sh
    - bash -n commands/linux/stop.sh
    - bash -n commands/macos/setup.sh
    - bash -n commands/macos/uninstall.sh
    - bash -n commands/macos/device.sh
    - bash -n commands/macos/start.sh
    - bash -n commands/macos/stop.sh
    - bash -n tool/kanata-tool
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify_windows:
  stage: verify
  image: mcr.microsoft.com/powershell:7.4-alpine
  script:
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("tool/kanata-tool.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("commands/windows/setup.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("commands/windows/uninstall.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("commands/windows/device.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("commands/windows/start.ps1",[ref]$null,[ref]$null) | Out-Null'
    - pwsh -NoProfile -Command '[System.Management.Automation.Language.Parser]::ParseFile("commands/windows/stop.ps1",[ref]$null,[ref]$null) | Out-Null'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

package:
  stage: package
  image: alpine:3.20
  before_script:
    - apk add --no-cache git zip tar coreutils
  script:
    - test -n "${CI_COMMIT_TAG}"
    - mkdir -p dist
    - git archive --format=tar.gz --prefix=kanata-settings-${CI_COMMIT_TAG}/ -o dist/kanata-settings-source-${CI_COMMIT_TAG}.tar.gz "${CI_COMMIT_TAG}"
    - git archive --format=zip --prefix=kanata-settings-${CI_COMMIT_TAG}/ -o dist/kanata-settings-source-${CI_COMMIT_TAG}.zip "${CI_COMMIT_TAG}"
    - sha256sum dist/kanata-settings-source-${CI_COMMIT_TAG}.tar.gz dist/kanata-settings-source-${CI_COMMIT_TAG}.zip > dist/SHA256SUMS
  artifacts:
    name: "kanata-settings-${CI_COMMIT_TAG}"
    paths:
      - dist/
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package
      artifacts: false
  script:
    - echo "Create GitLab Release"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "kanata-settings $CI_COMMIT_TAG"
    description: "Shell-script release for kanata-settings ($CI_COMMIT_TAG)"
    assets:
      links:
        - name: "kanata-settings-source-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/kanata-settings-source-${CI_COMMIT_TAG}.tar.gz?job=package"
          link_type: package
        - name: "kanata-settings-source-${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/kanata-settings-source-${CI_COMMIT_TAG}.zip?job=package"
          link_type: package
        - name: "SHA256SUMS"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/SHA256SUMS?job=package"
          link_type: other
  rules:
    - if: $CI_COMMIT_TAG
