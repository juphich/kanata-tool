name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-shell:
    name: Verify shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck \
            src/install.sh \
            src/scripts/package.sh \
            src/scripts/fetch-kanata-binaries.sh \
            src/commands/linux/*.sh \
            src/commands/macos/*.sh \
            src/bin/kanata-tool \
            src/lib/paths.sh \
            src/lib/keymap.sh \
            src/lib/linux-runtime.sh

      - name: Check shell syntax
        run: |
          bash -n src/install.sh
          bash -n src/scripts/package.sh
          bash -n src/scripts/fetch-kanata-binaries.sh
          bash -n src/commands/linux/setup.sh
          bash -n src/commands/linux/uninstall.sh
          bash -n src/commands/linux/device.sh
          bash -n src/commands/linux/start.sh
          bash -n src/commands/linux/status.sh
          bash -n src/commands/linux/stop.sh
          bash -n src/commands/macos/setup.sh
          bash -n src/commands/macos/uninstall.sh
          bash -n src/commands/macos/device.sh
          bash -n src/commands/macos/start.sh
          bash -n src/commands/macos/status.sh
          bash -n src/commands/macos/stop.sh
          bash -n src/bin/kanata-tool

  verify-powershell:
    name: Verify PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "src/install.ps1",
            "src/bin/kanata-tool.ps1",
            "src/lib/paths.ps1",
            "src/lib/keymap.ps1",
            "src/commands/windows/setup.ps1",
            "src/commands/windows/uninstall.ps1",
            "src/commands/windows/device.ps1",
            "src/commands/windows/keymap.ps1",
            "src/commands/windows/start.ps1",
            "src/commands/windows/status.ps1",
            "src/commands/windows/stop.ps1"
          )
          foreach ($file in $files) {
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$null) | Out-Null
          }

  package-check:
    name: Verify release package layout
    runs-on: ubuntu-latest
    needs:
      - verify-shell
      - verify-powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build test package
        run: |
          bash src/scripts/package.sh "0.0.0-ci"
          test -f "dist/kanata-tool-0.0.0-ci.tar.gz"
          test -f "dist/kanata-tool-0.0.0-ci.zip"
          test -f "dist/SHA256SUMS"

      - name: Verify flat package layout
        run: |
          tar -tzf dist/kanata-tool-0.0.0-ci.tar.gz | grep -q '^kanata-tool-0.0.0-ci/install.sh$'
          tar -tzf dist/kanata-tool-0.0.0-ci.tar.gz | grep -q '^kanata-tool-0.0.0-ci/config/linux/kanata.kbd$'
          ! tar -tzf dist/kanata-tool-0.0.0-ci.tar.gz | grep -q '^kanata-tool-0.0.0-ci/src/'

  release:
    name: Package and publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package-check
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Package release archive
        run: |
          bash src/scripts/package.sh "${GITHUB_REF_NAME}"
          test -f "dist/kanata-tool-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/kanata-tool-${GITHUB_REF_NAME}.zip"
          test -f "dist/SHA256SUMS"
          tar -tzf "dist/kanata-tool-${GITHUB_REF_NAME}.tar.gz" | grep -q "^kanata-tool-${GITHUB_REF_NAME}/install.sh$"
          ! tar -tzf "dist/kanata-tool-${GITHUB_REF_NAME}.tar.gz" | grep -q "^kanata-tool-${GITHUB_REF_NAME}/src/"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "kanata-tool ${{ github.ref_name }}"
          body: "kanata-tool release ${{ github.ref_name }}"
          files: |
            dist/kanata-tool-${{ github.ref_name }}.tar.gz
            dist/kanata-tool-${{ github.ref_name }}.zip
            dist/SHA256SUMS
